name: Website monitor
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      self_test:
        description: 'Test a separate notification incident and recovery without checking or changing the website'
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: website-monitor
  cancel-in-progress: false
jobs:
  monitor:
    if: github.repository == 'MasonPrather/prather-software-website' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: monitoring
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check website and update its incident
        run: node scripts/monitor.mjs
        env:
          WEBSITE_HEALTHCHECK_TOKEN: ${{ secrets.WEBSITE_HEALTHCHECK_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SELF_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.self_test && 'true' || 'false' }}
